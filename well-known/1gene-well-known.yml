method: probed
source: http://www.1gene.com.cn/
name: 1GENE well-known + contract discovery probe
description: >-
  Negative probe record for 1GENE (壹基因 / Hangzhou He-Yi Gene Technology Co., Ltd.), a
  Hangzhou non-invasive cancer early-screening diagnostics company. The company's own
  registrable domain 1gene.com.cn is still registered and its mail is live, but the web
  origin is no longer configured: www.1gene.com.cn answers HTTP 200 over plain HTTP with
  the stock Nginx Proxy Manager "Default Site" page ("You're trying to access a host that
  isn't set up yet", Last-Modified 2026-06-03), HTTPS on the same host aborts the TLS
  handshake with unrecognized_name, and the apex plus the m./admin. subdomains time out
  from a US vantage point. Every /.well-known/ path and every contract-discovery path on
  the reachable host returns a real 404 from that placeholder. No WellKnown, SecurityTxt,
  AgentCard, LLMsTxt, MCPServer or OpenAPI pointer is emitted from this probe, and none
  should be emitted from it in a later round.

