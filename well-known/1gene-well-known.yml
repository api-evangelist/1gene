  note: >-
    Registration predates and outlives the outage (created 2014-04-06, expires 2027-04-06)
    and NetEase mail plus an SPF record are still published, so the domain is held by the
    company group rather than parked by a third party. The web origin behind it is simply
    not configured — this is a serving state, not a domain loss, and is deliberately NOT
    wired as a Website pointer while it serves a placeholder.

soft_200_catch_all: false
soft_200_note: >-
  The reachable host does not answer 200 for everything. The root returns the 1,033-byte
  Nginx Proxy Manager default page; every other probed path returns a genuine 404 with a
  552-byte HTML error body. Neither is a document.

