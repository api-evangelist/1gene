name: 1GENE domain security posture
description: >-
  TLS/HSTS/DNS posture for the registrable domain 1GENE actually controls. Probed by hand
  rather than by probe-domain-security.py, because that helper reads hosts from a Website
  or Portal pointer in apis.yml and 1GENE deliberately carries neither — its web origin
  currently serves an unconfigured placeholder (see well-known/1gene-well-known.yml).
  Absence of a record is valid data, not a failed probe.

