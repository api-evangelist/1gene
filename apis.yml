x-domain-note: >-
  The company's registrable domain 1gene.com.cn is still registered through Alibaba Cloud
  (created 2014-04-06, expires 2027-04-06, status ok) and still carries live NetEase MX and
  SPF records, so the domain is held by the company group. The web origin behind it is not
  configured: www.1gene.com.cn answers HTTP 200 with the stock Nginx Proxy Manager "Default
  Site" placeholder (Last-Modified 2026-06-03), HTTPS on that host aborts the TLS handshake
  with unrecognized_name, and the apex plus the m./admin. subdomains do not answer at all.
  Every /.well-known/ and contract-discovery path on the reachable host returns a real 404.
  Because a placeholder is not a web presence, no type Website pointer is wired — the same
  posture applied to other harvest records with dead origins (roadmap#56). The EquityZen
  page that surfaced this company is a trading venue and is recorded as x-harvest-source-url,
  never as a Website. See well-known/1gene-well-known.yml for the full probe record.
