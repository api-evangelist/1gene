aid: 1gene
name: 1GENE
description: >-
  1GENE (壹基因) is the brand of Hangzhou He-Yi Gene Technology Co., Ltd., a Chinese
  molecular-diagnostics company founded in Hangzhou's Binjiang district in May 2014 by
  chairman and chief executive Junyi Wang. It develops non-invasive early cancer screening
  tests built on proprietary tumour DNA methylation markers and liquid- and stool-based
  biopsy chemistry, sold under the mission of "letting everyone stay away from cancer
  earlier". Its product pipeline covers colorectal cancer screening (常壹宁), gastric
  pathogen screening and medication guidance (优壹宁), gastric cancer screening (卫壹宁),
  and liver and oesophageal cancer screening in development; company scientists co-authored
  a validated stool-DNA biomarker panel for colorectal neoplasms in the Journal of Cancer
  Research and Clinical Oncology. The company raised an angel round in 2014, a RMB 49.5M
  Series A in 2015 and a Series B of several tens of millions of RMB from listed
  pharmaceutical maker Chengda Pharmaceuticals in December 2022, and its shares are listed
  for secondary-market trading on EquityZen. 1GENE sells a clinical test, not software: it
  publishes no developer program, no public API, no SDK and no machine-readable
  specification, and as of this profile its own web origin at www.1gene.com.cn is
  unconfigured and serves a placeholder page.
